<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Registro de Leads — Sprint Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    /* ---- cor ---- */
    --bg-app:#EEF1F6;
    --surface-card:#FFFFFF;
    --surface-dark:#14161F;
    --surface-dark-2:#1E212C;
    --surface-dark-3:#262A38;
    --ink:#12131A;
    --ink-muted:#6B7280;
    --paper:#F4F5FA;
    --paper-muted:#9AA0B4;
    --lime:#D8FB3B;
    --lime-ink:#14161F;
    --rust:#D4682F;
    --gold:#E3B23C;
    --mutedred:#A24B4B;
    --green:#4CAF6D;
    --border-light:rgba(18,19,26,0.08);
    --border-dark:rgba(244,245,250,0.08);
    --shadow-card:0 8px 24px rgba(20,22,31,0.08);

    /* ---- espaçamento ---- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    /* ---- tipografia ---- */
    --f-display:'Space Grotesk', sans-serif;
    --f-body:'IBM Plex Sans', sans-serif;
    --f-mono:'IBM Plex Mono', monospace;
    --fs-xs:12px; --fs-sm:13px; --fs-base:16px;
    --fs-md:20px; --fs-lg:25px; --fs-xl:32px; --fs-hero:40px;

    --radius-lg:20px; --radius-md:14px; --radius-sm:10px; --radius-pill:999px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-app);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:var(--fs-base);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:var(--fs-base);}
  :focus-visible{outline:2px solid var(--surface-dark); outline-offset:2px;}
  .on-dark :focus-visible{outline-color:var(--lime);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  #app{max-width:1180px; margin:0 auto; padding:var(--sp-5) var(--sp-4) 120px;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:var(--sp-6);
  }
  .brand{display:flex; align-items:baseline; gap:var(--sp-3);}
  .brand-mark{color:var(--lime); background:var(--surface-dark); width:28px; height:28px;
    border-radius:8px; display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--f-display); font-weight:700; font-size:14px;}
  .brand-name{font-family:var(--f-display); font-weight:700; font-size:var(--fs-md); letter-spacing:0.01em;}
  .brand-day{font-family:var(--f-mono); font-size:var(--fs-xs); color:var(--ink-muted);
    background:var(--surface-card); border:1px solid var(--border-light); padding:4px 10px; border-radius:var(--radius-pill); margin-left:var(--sp-3);}
  .btn-ghost{
    background:var(--surface-dark); color:var(--paper); border:none;
    padding:10px 18px; border-radius:var(--radius-pill); font-size:var(--fs-sm); font-weight:500;
    display:inline-flex; align-items:center; gap:8px; transition:transform .15s ease, background .15s ease;
  }
  .btn-ghost:hover{background:#1E212C;}
  .btn-ghost:active{transform:scale(0.97);}

  /* ---------- STATS ROW ---------- */
  .stats-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-4);
    margin-bottom:var(--sp-6);
  }
  .stat-card{
    background:var(--surface-card); border-radius:var(--radius-lg); padding:var(--sp-5);
    box-shadow:var(--shadow-card); opacity:0; transform:translateY(10px);
    animation:riseIn .5s ease forwards;
  }
  .stat-card:nth-child(1){animation-delay:.02s;}
  .stat-card:nth-child(2){animation-delay:.08s;}
  .stat-card:nth-child(3){animation-delay:.14s;}
  .stat-card:nth-child(4){animation-delay:.2s;}
  @keyframes riseIn{to{opacity:1; transform:translateY(0);}}

  .stat-label{font-family:var(--f-mono); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-muted); margin-bottom:var(--sp-3); display:block;}
  .stat-number{font-family:var(--f-display); font-size:var(--fs-xl); font-weight:700; color:var(--ink); display:block;}
  .stat-sub{font-size:var(--fs-sm); color:var(--ink-muted); margin-top:4px;}

  .stat-card.highlight{
    background:linear-gradient(160deg,#1B2033 0%, var(--surface-dark) 60%);
    color:var(--paper); position:relative; overflow:hidden;
  }
  .stat-card.highlight .stat-label{color:var(--paper-muted);}
  .stat-card.highlight .stat-number{color:var(--lime); font-size:var(--fs-hero); display:inline-flex; align-items:center; gap:10px;}
  .eye-toggle{
    background:none; border:none; color:var(--paper-muted); padding:4px; border-radius:6px; display:inline-flex;
  }
  .eye-toggle:hover{color:var(--paper);}
  .chip-row{display:flex; gap:var(--sp-2); margin:var(--sp-4) 0; flex-wrap:wrap;}
  .mini-chip{
    font-family:var(--f-mono); font-size:11px; padding:5px 10px; border-radius:var(--radius-pill);
    background:var(--surface-dark-2); color:var(--paper-muted); border:1px solid var(--border-dark);
  }
  .mini-chip.active{background:var(--lime); color:var(--lime-ink); border-color:var(--lime); font-weight:500;}
  .highlight-cta{
    width:100%; margin-top:var(--sp-2); background:var(--lime); color:var(--lime-ink); border:none;
    font-weight:600; font-size:var(--fs-sm); padding:12px; border-radius:var(--radius-pill);
    transition:transform .15s ease;
  }
  .highlight-cta:hover{transform:translateY(-1px);}
  .stat-footnote{font-size:11px; color:var(--paper-muted); margin-top:var(--sp-3); line-height:1.5;}

  /* ---------- FILTERS ---------- */
  .filters-row{
    display:flex; gap:var(--sp-2); margin-bottom:var(--sp-4);
    overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;
  }
  .filters-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex:0 0 auto; background:var(--surface-card); border:1px solid var(--border-light);
    color:var(--ink); padding:9px 16px; border-radius:var(--radius-pill); font-size:var(--fs-sm); font-weight:500;
    white-space:nowrap; transition:background .15s ease, color .15s ease;
  }
  .filter-chip.active{background:var(--surface-dark); color:var(--lime); border-color:var(--surface-dark);}
  .filter-chip .count{opacity:.6; margin-left:4px;}

  /* ---------- WORKSPACE (painel escuro) ---------- */
  .workspace{
    background:var(--surface-dark); border-radius:var(--radius-lg); overflow:hidden;
    display:grid; grid-template-columns:380px 1fr; min-height:520px;
    box-shadow:var(--shadow-card);
  }
  .list-panel{border-right:1px solid var(--border-dark); display:flex; flex-direction:column; max-height:640px;}
  .list-header{
    padding:var(--sp-5) var(--sp-5) var(--sp-4); color:var(--paper); font-family:var(--f-display);
    font-weight:600; font-size:var(--fs-md); display:flex; align-items:center; gap:8px;
  }
  .list-header .count-badge{font-family:var(--f-mono); font-size:var(--fs-xs); color:var(--paper-muted); font-weight:400;}
  .list-scroll{overflow-y:auto; padding:0 var(--sp-3) var(--sp-4);}

  .lead-row{
    display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-3);
    border-radius:var(--radius-md); cursor:pointer; transition:background .15s ease;
    border:1px solid transparent; margin-bottom:4px;
  }
  .lead-row:hover{background:var(--surface-dark-2);}
  .lead-row.selected{background:var(--surface-dark-2); border-color:var(--border-dark);}
  .lead-row.atrasado{border-left:3px solid var(--rust);}
  .avatar{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-family:var(--f-display); font-weight:600; font-size:14px; color:var(--paper);
  }
  .lead-row-info{flex:1; min-width:0;}
  .lead-row-name{color:var(--paper); font-weight:500; font-size:var(--fs-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lead-row-meta{color:var(--paper-muted); font-size:11px; font-family:var(--f-mono); margin-top:2px;}
  .status-badge{
    font-family:var(--f-mono); font-size:10px; padding:4px 9px; border-radius:var(--radius-pill);
    white-space:nowrap; text-transform:uppercase; letter-spacing:.03em; flex:0 0 auto;
  }
  .status-a_visitar{background:var(--surface-dark-3); color:var(--paper-muted);}
  .status-sem_contato{background:rgba(212,104,47,.18); color:var(--rust);}
  .status-reuniao_agendada{background:rgba(227,178,60,.18); color:var(--gold);}
  .status-recusou{background:rgba(162,75,75,.2); color:var(--mutedred);}
  .status-fechado{background:rgba(76,175,109,.18); color:var(--green);}

  .empty-list{color:var(--paper-muted); text-align:center; padding:var(--sp-8) var(--sp-5); font-size:var(--fs-sm);}
  .empty-list button{margin-top:var(--sp-4); background:var(--lime); color:var(--lime-ink); border:none; padding:10px 20px; border-radius:var(--radius-pill); font-weight:600; font-size:var(--fs-sm);}

  /* ---------- DETAIL / FICHA ---------- */
  .detail-panel{padding:var(--sp-5) var(--sp-6); overflow-y:auto; max-height:640px;}
  .detail-empty{
    height:100%; display:flex; align-items:center; justify-content:center; color:var(--paper-muted);
    font-size:var(--fs-sm); text-align:center; min-height:400px;
  }
  .detail-empty[hidden]{ display:none; }
  .ficha-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:var(--sp-5); gap:var(--sp-3);}
  .ficha-id{font-family:var(--f-mono); font-size:var(--fs-xs); color:var(--paper-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; display:block;}
  .ficha-title{font-family:var(--f-display); font-weight:700; font-size:var(--fs-xl); color:var(--paper);}
  .ficha-sub{color:var(--paper-muted); font-size:var(--fs-sm); margin-top:4px;}
  .icon-btn{background:var(--surface-dark-2); border:1px solid var(--border-dark); color:var(--paper-muted); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .icon-btn:hover{color:var(--paper);}
  .header-actions{display:flex; gap:8px;}

  .ficha-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); margin-bottom:var(--sp-5);}
  .ficha-box{background:var(--surface-dark-2); border-radius:var(--radius-md); padding:var(--sp-4); border:1px solid var(--border-dark);}
  .ficha-box-label{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; color:var(--paper-muted); letter-spacing:.05em; display:block; margin-bottom:6px;}
  .ficha-box-value{color:var(--paper); font-size:var(--fs-sm); font-weight:500;}

  .section-title{font-family:var(--f-display); font-weight:600; font-size:var(--fs-sm); color:var(--paper); text-transform:uppercase; letter-spacing:.04em; margin:var(--sp-5) 0 var(--sp-3); display:block;}
  .field-block{margin-bottom:var(--sp-4);}
  .field-label{font-size:11px; font-family:var(--f-mono); color:var(--paper-muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:6px;}
  .field-input, .field-textarea, .field-select{
    width:100%; background:var(--surface-dark-2); border:1px solid var(--border-dark); color:var(--paper);
    border-radius:var(--radius-sm); padding:10px 12px; font-size:var(--fs-sm);
  }
  .field-textarea{min-height:70px; resize:vertical;}
  .field-input::placeholder, .field-textarea::placeholder{color:#5A6072;}
  .toggle-row{display:flex; align-items:center; gap:10px; margin-bottom:var(--sp-4);}
  .toggle-switch{position:relative; width:44px; height:24px; background:var(--surface-dark-3); border-radius:var(--radius-pill); border:1px solid var(--border-dark); flex:0 0 auto;}
  .toggle-switch.on{background:var(--lime);}
  .toggle-switch::after{content:''; position:absolute; width:18px; height:18px; background:var(--paper); border-radius:50%; top:2px; left:2px; transition:transform .15s ease;}
  .toggle-switch.on::after{transform:translateX(20px); background:var(--lime-ink);}
  .toggle-label{color:var(--paper); font-size:var(--fs-sm);}

  .valor-row{display:flex; align-items:center; gap:8px;}
  .valor-row .field-input{flex:1;}

  /* fatura summary */
  .invoice-summary{background:var(--surface-dark-2); border-radius:var(--radius-md); padding:var(--sp-4); margin-top:var(--sp-5); border:1px solid var(--border-dark);}
  .invoice-line{display:flex; justify-content:space-between; padding:8px 0; font-size:var(--fs-sm); color:var(--paper-muted); border-bottom:1px solid var(--border-dark);}
  .invoice-line:last-child{border-bottom:none;}
  .invoice-line.total{color:var(--lime); font-weight:600; font-size:var(--fs-md); font-family:var(--f-display); border-top:1px solid var(--border-dark); margin-top:4px; padding-top:14px;}

  .save-bar{display:flex; gap:var(--sp-3); margin-top:var(--sp-6);}
  .btn-primary{background:var(--lime); color:var(--lime-ink); border:none; padding:12px 22px; border-radius:var(--radius-pill); font-weight:600; font-size:var(--fs-sm); flex:1;}
  .btn-secondary{background:transparent; color:var(--mutedred); border:1px solid var(--mutedred); padding:12px 18px; border-radius:var(--radius-pill); font-weight:500; font-size:var(--fs-sm);}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; bottom:28px; right:28px; background:var(--surface-dark); color:var(--lime); border:none;
    padding:16px 24px; border-radius:var(--radius-pill); font-weight:600; font-size:var(--fs-sm);
    box-shadow:0 10px 28px rgba(20,22,31,.28); display:flex; align-items:center; gap:8px; z-index:40;
    transition:transform .15s ease;
  }
  .fab:hover{transform:translateY(-2px);}

  /* ---------- SHEETS / MODALS ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(18,19,26,.55); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet-overlay[hidden]{ display:none; }
  .sheet{
    background:var(--surface-dark); color:var(--paper); width:100%; max-width:560px;
    border-radius:24px 24px 0 0; padding:var(--sp-5); max-height:88vh; overflow-y:auto;
  }
  @media (min-width:700px){
    .sheet-overlay{align-items:center;}
    .sheet{border-radius:var(--radius-lg);}
  }
  .sheet-title{font-family:var(--f-display); font-weight:700; font-size:var(--fs-lg); margin-bottom:var(--sp-4);}
  .sheet-close{position:absolute; top:0; right:0;}

  .export-option-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border-dark);}
  .export-status-list{display:flex; flex-direction:column; gap:2px; margin:var(--sp-3) 0 var(--sp-5);}
  .checkbox-row{display:flex; align-items:center; gap:10px; padding:8px 0; color:var(--paper); font-size:var(--fs-sm);}
  .checkbox-row input{width:18px; height:18px; accent-color:var(--lime);}

  /* ---------- MOBILE ---------- */
  @media (max-width:900px){
    #app{padding:var(--sp-4) var(--sp-3) 110px;}
    .stats-row{
      display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:var(--sp-3);
      margin:0 calc(-1 * var(--sp-3)) var(--sp-5); padding:0 var(--sp-3) 6px;
    }
    .stats-row::-webkit-scrollbar{display:none;}
    .stat-card{flex:0 0 78%; scroll-snap-align:start;}
    .workspace{grid-template-columns:1fr; position:relative;}
    .list-panel{border-right:none; max-height:none;}
    .detail-panel{
      position:fixed; inset:0; background:var(--surface-dark); z-index:80; max-height:none;
      transform:translateX(100%); transition:transform .25s ease; padding-top:var(--sp-6);
    }
    .detail-panel.open{transform:translateX(0);}
    .detail-back{display:flex !important;}
    .fab{right:20px; bottom:20px; padding:14px 20px;}
    .brand-day{display:none;}
  }
  .detail-back{display:none; background:var(--surface-dark-2); border:1px solid var(--border-dark); color:var(--paper);
    width:34px; height:34px; border-radius:10px; align-items:center; justify-content:center; margin-bottom:var(--sp-4);}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">Z</span>
      <span class="brand-name">SPRINT ZERO</span>
      <span class="brand-day" id="brandDay">Dia 1/15</span>
    </div>
    <button class="btn-ghost" id="exportBtn">↓ Exportar PDF</button>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="filters-row" id="filtersRow"></div>

  <div class="workspace">
    <div class="list-panel">
      <div class="list-header">Leads <span class="count-badge" id="listCount"></span></div>
      <div class="list-scroll" id="listScroll"></div>
    </div>
    <div class="detail-panel" id="detailPanel">
      <button class="detail-back" id="detailBack">←</button>
      <div class="detail-empty" id="detailEmpty">Toque em um lead na lista pra ver a ficha completa.</div>
      <div id="detailContent" hidden></div>
    </div>
  </div>

</div>

<button class="fab" id="fabAdd">+ Novo lead</button>

<!-- QUICK ADD SHEET -->
<div class="sheet-overlay" id="quickSheet" hidden>
  <div class="sheet">
    <div class="sheet-title">Novo lead</div>
    <div class="field-block">
      <span class="field-label">Negócio</span>
      <input class="field-input" id="qNegocio" placeholder="Ex: Padaria do Zé">
    </div>
    <div class="field-block">
      <span class="field-label">Bairro</span>
      <input class="field-input" id="qBairro" placeholder="Ex: Asa Norte">
    </div>
    <div class="toggle-row">
      <div class="toggle-switch on" id="qPresenteToggle"></div>
      <span class="toggle-label">Responsável estava presente</span>
    </div>
    <div class="field-block" id="qResponsavelBlock">
      <span class="field-label">Nome do responsável (se souber)</span>
      <input class="field-input" id="qNomeResponsavel" placeholder="Opcional">
    </div>
    <div class="field-block">
      <span class="field-label">Status</span>
      <select class="field-select" id="qStatus"></select>
    </div>
    <div class="field-block" id="qRetomarBlock" hidden>
      <span class="field-label">Retomar quando</span>
      <input class="field-input" type="date" id="qRetomar">
    </div>
    <div class="save-bar">
      <button class="btn-secondary" id="qCancel">Cancelar</button>
      <button class="btn-primary" id="qSave">Salvar lead</button>
    </div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="sheet-overlay" id="exportModal" hidden>
  <div class="sheet">
    <div class="sheet-title">Exportar PDF</div>
    <span class="field-label">Incluir status</span>
    <div class="export-status-list" id="exportStatusList"></div>
    <div class="export-option-row">
      <span class="toggle-label">Incluir valores fechados</span>
      <div class="toggle-switch" id="exportValoresToggle"></div>
    </div>
    <div class="save-bar">
      <button class="btn-secondary" id="exportCancel">Cancelar</button>
      <button class="btn-primary" id="exportGenerate">Gerar PDF</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STATUS_META = {
    a_visitar:        { label:'A visitar', color:'a_visitar' },
    sem_contato:      { label:'Sem contato', color:'sem_contato' },
    reuniao_agendada: { label:'Reunião agendada', color:'reuniao_agendada' },
    recusou:          { label:'Recusou', color:'recusou' },
    fechado:          { label:'Cliente fechado', color:'fechado' }
  };
  const STATUS_ORDER = ['a_visitar','sem_contato','reuniao_agendada','recusou','fechado'];
  const AVATAR_COLORS = ['#4B5563','#3B5A63','#5B4B63','#63594B','#3B4B63'];

  let leads = [];
  let selectedId = null;
  let activeFilter = 'todos';
  let valorMasked = true;
  let heroMasked = true;
  let sheetPresente = true;
  let exportValores = false;
  let exportStatusSel = new Set(STATUS_ORDER);

  const $ = (id) => document.getElementById(id);
  const uid = () => 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const todayStr = () => new Date().toISOString().slice(0,10);
  const brl = (n) => 'R$ ' + Number(n||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  const initials = (name) => (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const avatarColor = (str) => AVATAR_COLORS[Math.abs(hashCode(str||'')) % AVATAR_COLORS.length];
  function hashCode(s){let h=0; for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i); h|=0;} return h;}

  async function loadLeads(){
    try{
      const res = await fetch('/api/leads');
      if(!res.ok) throw new Error('Falha ao buscar leads');
      const data = await res.json();
      leads = data && data.value ? JSON.parse(data.value) : [];
    }catch(e){ leads = []; }
    render();
  }
  async function saveLeads(){
    try{
      await fetch('/api/leads', {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(leads)
      });
    }catch(e){ console.error('Erro ao salvar', e); }
  }

  // ---------- COMISSÃO ----------
  function commissionEstimate(){
    const fechados = leads.filter(l=>l.status==='fechado');
    const count = fechados.length;
    let pct = 0;
    if(count===1) pct=0.25; else if(count===2) pct=0.32; else if(count>=3) pct=0.40;
    const reunioes = leads.filter(l=>l.status==='reuniao_agendada').length;
    const fromReunioes = reunioes * 50;
    const fromFechados = fechados.reduce((sum,l)=> sum + (Number(l.valorContrato)||0) * pct, 0);
    return { total: fromReunioes + fromFechados, pct, count, reunioes, fromReunioes, fromFechados };
  }

  // ---------- RENDER: STATS ----------
  function renderStats(){
    const visitados = leads.filter(l=>l.status!=='a_visitar').length;
    const agendadas = leads.filter(l=>l.status==='reuniao_agendada').length;
    const atrasados = leads.filter(l=> l.status==='sem_contato' && l.retomarQuando && l.retomarQuando <= todayStr()).length;
    const c = commissionEstimate();

    const tierLabel = c.count===0 ? 'sem fechamento ainda' : (c.pct*100)+'% de tier';

    $('statsRow').innerHTML = `
      <div class="stat-card">
        <span class="stat-label">Leads visitados</span>
        <span class="stat-number">${visitados}</span>
        <span class="stat-sub">de ${leads.length} cadastrados</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Reuniões agendadas</span>
        <span class="stat-number">${agendadas}</span>
        <span class="stat-sub">aguardando acontecer</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Retornos atrasados</span>
        <span class="stat-number">${atrasados}</span>
        <span class="stat-sub">${atrasados>0 ? 'precisam de revisita' : 'tudo em dia'}</span>
      </div>
      <div class="stat-card highlight">
        <span class="stat-label">Comissão estimada</span>
        <span class="stat-number">
          <span id="heroValue">${heroMasked ? '••••••' : brl(c.total)}</span>
          <button class="eye-toggle" id="heroEyeBtn" aria-label="Mostrar ou esconder valor">${heroMasked ? eyeClosedSvg() : eyeOpenSvg()}</button>
        </span>
        <div class="chip-row">
          <span class="mini-chip">${c.reunioes} reunião(ões) · R$50</span>
          <span class="mini-chip ${c.count>0?'active':''}">${c.count} fechado(s) · ${tierLabel}</span>
        </div>
        <button class="highlight-cta" id="heroExportBtn">Exportar PDF</button>
        <div class="stat-footnote">+ 10%/mês recorrente por cliente ativo, enquanto não cancelar (sem fidelidade).</div>
      </div>
    `;
    $('heroEyeBtn').onclick = ()=>{ heroMasked = !heroMasked; renderStats(); };
    $('heroExportBtn').onclick = openExportModal;

    const dayNum = sprintDay();
    $('brandDay').textContent = `Dia ${dayNum}/15`;
  }

  function sprintDay(){
    if(leads.length===0) return 1;
    const dates = leads.map(l=>new Date(l.criadoEm)).sort((a,b)=>a-b);
    const start = dates[0];
    const diff = Math.floor((Date.now()-start)/(1000*60*60*24)) + 1;
    return Math.min(15, Math.max(1, diff));
  }

  // ---------- RENDER: FILTERS ----------
  function renderFilters(){
    const counts = { todos: leads.length };
    STATUS_ORDER.forEach(s=> counts[s] = leads.filter(l=>l.status===s).length);
    const items = [
      {key:'todos', label:'Todos'},
      {key:'a_visitar', label:'A visitar'},
      {key:'sem_contato', label:'Sem contato'},
      {key:'reuniao_agendada', label:'Reunião agendada'},
      {key:'recusou', label:'Recusou'},
      {key:'fechado', label:'Fechado'},
    ];
    $('filtersRow').innerHTML = items.map(it=>`
      <button class="filter-chip ${activeFilter===it.key?'active':''}" data-filter="${it.key}">
        ${it.label} <span class="count">${counts[it.key]!==undefined?counts[it.key]:''}</span>
      </button>
    `).join('');
    $('filtersRow').querySelectorAll('.filter-chip').forEach(btn=>{
      btn.onclick = ()=>{ activeFilter = btn.dataset.filter; render(); };
    });
  }

  function filteredLeads(){
    let arr = leads.slice().sort((a,b)=> new Date(b.criadoEm) - new Date(a.criadoEm));
    if(activeFilter!=='todos') arr = arr.filter(l=>l.status===activeFilter);
    return arr;
  }

  // ---------- RENDER: LIST ----------
  function renderList(){
    const arr = filteredLeads();
    $('listCount').textContent = arr.length ? `(${arr.length})` : '';
    if(leads.length===0){
      $('listScroll').innerHTML = `
        <div class="empty-list">
          Nenhum lead ainda.<br>Cadastre o primeiro assim que sair pra rua.
          <br><button id="emptyAddBtn">+ Novo lead</button>
        </div>`;
      $('emptyAddBtn').onclick = openQuickSheet;
      return;
    }
    if(arr.length===0){
      $('listScroll').innerHTML = `<div class="empty-list">Nenhum lead nesse filtro.</div>`;
      return;
    }
    $('listScroll').innerHTML = arr.map(l=>{
      const atrasado = l.status==='sem_contato' && l.retomarQuando && l.retomarQuando <= todayStr();
      const meta = l.bairro || '—';
      return `
      <div class="lead-row ${l.id===selectedId?'selected':''} ${atrasado?'atrasado':''}" data-id="${l.id}">
        <div class="avatar" style="background:${avatarColor(l.negocio)}">${initials(l.negocio)}</div>
        <div class="lead-row-info">
          <div class="lead-row-name">${escapeHtml(l.negocio||'Sem nome')}</div>
          <div class="lead-row-meta">${escapeHtml(meta)}${atrasado?' · atrasado':''}</div>
        </div>
        <span class="status-badge status-${l.status}">${STATUS_META[l.status].label}</span>
      </div>`;
    }).join('');
    $('listScroll').querySelectorAll('.lead-row').forEach(row=>{
      row.onclick = ()=>{ selectedId = row.dataset.id; render(); openDetailMobile(); };
    });
  }

  // ---------- RENDER: DETAIL ----------
  function renderDetail(){
    const lead = leads.find(l=>l.id===selectedId);
    if(!lead){
      $('detailEmpty').hidden = false;
      $('detailContent').hidden = true;
      return;
    }
    $('detailEmpty').hidden = true;
    $('detailContent').hidden = false;

    const c = singleLeadCommission(lead);

    $('detailContent').innerHTML = `
      <div class="ficha-header">
        <div>
          <span class="ficha-id">FICHA #${lead.id.slice(-5).toUpperCase()}</span>
          <div class="ficha-title">${escapeHtml(lead.negocio||'Sem nome')}</div>
          <div class="ficha-sub">${escapeHtml(lead.bairro||'Bairro não informado')}</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="deleteLeadBtn" title="Excluir lead">🗑</button>
        </div>
      </div>

      <div class="ficha-grid">
        <div class="ficha-box">
          <span class="ficha-box-label">Responsável presente</span>
          <span class="ficha-box-value">${lead.responsavelPresente ? 'Sim' : 'Não'}</span>
        </div>
        <div class="ficha-box">
          <span class="ficha-box-label">Status</span>
          <span class="ficha-box-value">${STATUS_META[lead.status].label}</span>
        </div>
      </div>

      <span class="section-title">Dados</span>
      <div class="field-block">
        <span class="field-label">Nome do responsável</span>
        <input class="field-input" id="dNomeResponsavel" value="${attr(lead.nomeResponsavel)}" placeholder="Opcional">
      </div>
      <div class="toggle-row">
        <div class="toggle-switch ${lead.responsavelPresente?'on':''}" id="dPresenteToggle"></div>
        <span class="toggle-label">Responsável estava presente</span>
      </div>
      <div class="field-block" id="dRetomarBlock" ${lead.responsavelPresente ? 'hidden' : ''}>
        <span class="field-label">Retomar quando</span>
        <input class="field-input" type="date" id="dRetomar" value="${attr(lead.retomarQuando)}">
      </div>
      <div class="field-block">
        <span class="field-label">Status</span>
        <select class="field-select" id="dStatus">
          ${STATUS_ORDER.map(s=>`<option value="${s}" ${s===lead.status?'selected':''}>${STATUS_META[s].label}</option>`).join('')}
        </select>
      </div>

      <span class="section-title">Qualificação</span>
      <div class="field-block">
        <span class="field-label">Dores identificadas</span>
        <textarea class="field-textarea" id="dDores" placeholder="Ex: depende muito do iFood, sem cliente direto...">${escapeHtml(lead.doresIdentificadas)}</textarea>
      </div>
      <div class="field-block">
        <span class="field-label">Observações</span>
        <textarea class="field-textarea" id="dObs" placeholder="Qualquer detalhe relevante">${escapeHtml(lead.observacoes)}</textarea>
      </div>

      <div class="field-block" id="dValorBlock" ${lead.status!=='fechado' ? 'hidden' : ''}>
        <span class="field-label">Valor do contrato fechado</span>
        <div class="valor-row">
          <input class="field-input" type="${valorMasked ? 'password' : 'number'}" id="dValor" value="${lead.valorContrato ?? ''}" placeholder="0,00">
          <button class="icon-btn" id="valorEyeBtn">${valorMasked ? eyeClosedSvg() : eyeOpenSvg()}</button>
        </div>
      </div>

      <div class="invoice-summary">
        <div class="invoice-line"><span>Reunião qualificada</span><span>${lead.status==='reuniao_agendada' ? brl(50) : '—'}</span></div>
        <div class="invoice-line"><span>Comissão sobre fechamento</span><span>${lead.status==='fechado' ? brl(c) : '—'}</span></div>
        <div class="invoice-line total"><span>Estimativa deste lead</span><span>${brl(lead.status==='fechado' ? c : (lead.status==='reuniao_agendada'?50:0))}</span></div>
      </div>

      <div class="save-bar">
        <button class="btn-secondary" id="deleteLeadBtn2">Excluir</button>
        <button class="btn-primary" id="saveLeadBtn">Salvar alterações</button>
      </div>
    `;

    $('dPresenteToggle').onclick = ()=>{
      lead.responsavelPresente = !lead.responsavelPresente;
      $('dPresenteToggle').classList.toggle('on', lead.responsavelPresente);
      $('dRetomarBlock').hidden = lead.responsavelPresente;
    };
    $('dStatus').onchange = (e)=>{
      $('dValorBlock').hidden = e.target.value!=='fechado';
    };
    $('valorEyeBtn').onclick = ()=>{ valorMasked = !valorMasked; renderDetail(); };
    $('deleteLeadBtn').onclick = $('deleteLeadBtn2').onclick = ()=> deleteLead(lead.id);
    $('saveLeadBtn').onclick = ()=> saveLeadEdits(lead.id);
  }

  function singleLeadCommission(lead){
    const c = commissionEstimate();
    return (Number(lead.valorContrato)||0) * c.pct;
  }

  function saveLeadEdits(id){
    const lead = leads.find(l=>l.id===id);
    if(!lead) return;
    lead.nomeResponsavel = $('dNomeResponsavel').value.trim();
    lead.retomarQuando = $('dRetomar') ? $('dRetomar').value : '';
    lead.status = $('dStatus').value;
    lead.doresIdentificadas = $('dDores').value.trim();
    lead.observacoes = $('dObs').value.trim();
    if(!lead.responsavelPresente && $('dRetomar')) lead.retomarQuando = $('dRetomar').value;
    if(lead.status==='fechado' && $('dValor')){
      lead.valorContrato = $('dValor').value ? Number($('dValor').value) : null;
    } else if(lead.status!=='fechado'){
      lead.valorContrato = null;
    }
    lead.atualizadoEm = new Date().toISOString();
    saveLeads();
    render();
  }

  function deleteLead(id){
    if(!confirm('Excluir esse lead? Essa ação não pode ser desfeita.')) return;
    leads = leads.filter(l=>l.id!==id);
    if(selectedId===id) selectedId = null;
    saveLeads();
    render();
    closeDetailMobile();
  }

  // ---------- QUICK ADD ----------
  function openQuickSheet(){
    $('qNegocio').value=''; $('qBairro').value=''; $('qNomeResponsavel').value='';
    sheetPresente = true;
    $('qPresenteToggle').classList.add('on');
    $('qResponsavelBlock').hidden = false;
    $('qRetomarBlock').hidden = true;
    $('qStatus').innerHTML = STATUS_ORDER.filter(s=>s!=='a_visitar').map(s=>`<option value="${s}">${STATUS_META[s].label}</option>`).join('');
    $('qStatus').value = sheetPresente ? 'reuniao_agendada' : 'sem_contato';
    $('quickSheet').hidden = false;
  }
  $('fabAdd').onclick = openQuickSheet;
  $('qCancel').onclick = ()=> $('quickSheet').hidden = true;
  $('qPresenteToggle').onclick = ()=>{
    sheetPresente = !sheetPresente;
    $('qPresenteToggle').classList.toggle('on', sheetPresente);
    $('qRetomarBlock').hidden = sheetPresente;
    if(!sheetPresente){ $('qStatus').value='sem_contato'; }
  };
  $('qSave').onclick = async ()=>{
    const negocio = $('qNegocio').value.trim();
    const bairro = $('qBairro').value.trim();
    if(!negocio){ $('qNegocio').focus(); return; }
    const lead = {
      id: uid(),
      negocio, bairro,
      responsavelPresente: sheetPresente,
      nomeResponsavel: $('qNomeResponsavel').value.trim(),
      status: sheetPresente ? $('qStatus').value : 'sem_contato',
      retomarQuando: !sheetPresente ? $('qRetomar').value : '',
      doresIdentificadas:'', observacoes:'', valorContrato:null,
      criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString()
    };
    leads.push(lead);
    await saveLeads();
    selectedId = lead.id;
    $('quickSheet').hidden = true;
    render();
  };

  // ---------- MOBILE DETAIL NAV ----------
  function openDetailMobile(){
    if(window.innerWidth<=900) $('detailPanel').classList.add('open');
  }
  function closeDetailMobile(){ $('detailPanel').classList.remove('open'); }
  $('detailBack').onclick = closeDetailMobile;

  // ---------- EXPORT ----------
  function openExportModal(){
    exportStatusSel = new Set(STATUS_ORDER);
    exportValores = false;
    renderExportModal();
    $('exportModal').hidden = false;
  }
  function renderExportModal(){
    $('exportStatusList').innerHTML = STATUS_ORDER.map(s=>`
      <label class="checkbox-row">
        <input type="checkbox" data-status="${s}" ${exportStatusSel.has(s)?'checked':''}>
        ${STATUS_META[s].label}
      </label>
    `).join('');
    $('exportStatusList').querySelectorAll('input').forEach(cb=>{
      cb.onchange = ()=>{
        if(cb.checked) exportStatusSel.add(cb.dataset.status); else exportStatusSel.delete(cb.dataset.status);
      };
    });
    $('exportValoresToggle').classList.toggle('on', exportValores);
  }
  $('exportValoresToggle').onclick = ()=>{ exportValores=!exportValores; renderExportModal(); };
  $('exportCancel').onclick = ()=> $('exportModal').hidden = true;
  $('exportBtn').onclick = openExportModal;
  $('exportGenerate').onclick = ()=>{ generatePDF(); $('exportModal').hidden = true; };

  function generatePDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 48; let y = 60;
    const pageH = doc.internal.pageSize.getHeight();

    doc.setFont('helvetica','bold'); doc.setFontSize(18);
    doc.text('Registro de Leads — Sprint Zero', marginX, y);
    y += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(110);
    doc.text('Exportado em ' + new Date().toLocaleDateString('pt-BR'), marginX, y);
    y += 24;
    doc.setTextColor(20);

    const arr = leads.filter(l=>exportStatusSel.has(l.status))
                      .sort((a,b)=> new Date(b.criadoEm)-new Date(a.criadoEm));

    if(arr.length===0){
      doc.text('Nenhum lead nos filtros selecionados.', marginX, y);
    }

    arr.forEach((l, idx)=>{
      const blockLines = [];
      blockLines.push(['Negócio', l.negocio||'-']);
      blockLines.push(['Bairro', l.bairro||'-']);
      blockLines.push(['Responsável', l.nomeResponsavel||'-']);
      blockLines.push(['Presente na visita', l.responsavelPresente?'Sim':'Não']);
      blockLines.push(['Status', STATUS_META[l.status].label]);
      if(!l.responsavelPresente && l.retomarQuando) blockLines.push(['Retomar em', l.retomarQuando]);
      if(l.doresIdentificadas) blockLines.push(['Dores identificadas', l.doresIdentificadas]);
      if(l.observacoes) blockLines.push(['Observações', l.observacoes]);
      if(l.status==='fechado' && exportValores && l.valorContrato) blockLines.push(['Valor fechado', 'R$ ' + Number(l.valorContrato).toLocaleString('pt-BR',{minimumFractionDigits:2})]);

      const blockHeight = 20 + blockLines.length * 14 + 10;
      if(y + blockHeight > pageH - 40){ doc.addPage(); y = 50; }

      doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(`${idx+1}. ${l.negocio||'Sem nome'}`, marginX, y);
      y += 16;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      blockLines.forEach(([label,val])=>{
        const text = `${label}: ${val}`;
        const split = doc.splitTextToSize(text, 480);
        split.forEach(line=>{
          if(y > pageH - 40){ doc.addPage(); y = 50; }
          doc.text(line, marginX + 10, y);
          y += 14;
        });
      });
      y += 10;
      doc.setDrawColor(220); doc.line(marginX, y-4, marginX+500, y-4);
      y += 10;
    });

    doc.save('leads-sprint-zero.pdf');
  }

  // ---------- HELPERS ----------
  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function attr(str){ return escapeHtml(str||''); }
  function eyeClosedSvg(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.4 5.5A9.6 9.6 0 0112 5c5 0 9 4 10 7-.6 1.8-1.8 3.6-3.4 5M6.6 6.6C4.4 8 2.8 10 2 12c1.3 4 5.5 7 10 7 1.3 0 2.6-.2 3.7-.7"/></svg>`; }
  function eyeOpenSvg(){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`; }

  function render(){
    renderStats();
    renderFilters();
    renderList();
    renderDetail();
  }

  // ---------- ROBUSTEZ DOS MODAIS ----------
  // Clicar fora do card fecha o modal; Esc fecha qualquer modal aberto.
  [$('quickSheet'), $('exportModal')].forEach(overlay=>{
    overlay.addEventListener('click', (e)=>{
      if(e.target === overlay) overlay.hidden = true;
    });
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key !== 'Escape') return;
    if(!$('quickSheet').hidden) $('quickSheet').hidden = true;
    if(!$('exportModal').hidden) $('exportModal').hidden = true;
  });

  loadLeads();
})();
</script>
</body>
</html>
